# Chargé AUTOMATIQUEMENT par Docker Compose en local uniquement.
# Coolify n'utilise que docker-compose.yml.

services:
  app:
    container_name: gestion-finance-app
    ports:
      - "80:80"
    volumes:
      # Bind mounts pour inspecter les logs directement en local
      - ./storage/logs:/app/storage/logs
      - ./storage/app:/app/storage/app

  db:
    container_name: gestion-finance-db
    ports:
      - "3306:3306"
