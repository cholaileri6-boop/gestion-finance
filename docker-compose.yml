services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestion-finance-app
    ports:
      - "80:80"
    environment:
      - APP_NAME=GestionFinance
      - APP_ENV=production
      - APP_KEY=base64:5f3xyPlxUzm5E6xq5JsRgdgbZoc9kZcZS9IxFdZbUeA=
      - APP_DEBUG=false
      - APP_URL=http://localhost
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=gestion_finance
      - DB_USERNAME=gestion
      - DB_PASSWORD=GestionFinance2024!Secure
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - SESSION_DRIVER=database
      - LOG_CHANNEL=stack
      - MAIL_MAILER=log
    volumes:
      - ./storage/logs:/app/storage/logs
      - ./storage/app:/app/storage/app
      - ./database:/app/database
      - ./bootstrap/cache:/app/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gestion-finance
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  db:
    image: mysql:8.0.36
    container_name: gestion-finance-db
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword2024!Secure
      MYSQL_DATABASE: gestion_finance
      MYSQL_USER: gestion
      MYSQL_PASSWORD: GestionFinance2024!Secure
    ports:
      - "3306:3306"
    volumes:
      - gestion-finance-db:/var/lib/mysql
    networks:
      - gestion-finance
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootPassword2024!Secure"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

networks:
  gestion-finance:
    driver: bridge

volumes:
  gestion-finance-db:
    driver: local
