[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ─── Initialisation one-shot (migrations, caches, storage:link) ───────────────
# priority=1 → démarre en premier.  autorestart=false → s'exécute UNE seule fois.
[program:startup]
command=/startup.sh
autostart=true
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=root
priority=1

# ─── PHP-FPM ──────────────────────────────────────────────────────────────────
# Le master tourne en root, les workers descendent vers www-data via le pool.
[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
user=root
priority=10

# ─── Nginx ────────────────────────────────────────────────────────────────────
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
user=root
priority=10

# ─── Laravel Queue Worker ─────────────────────────────────────────────────────
# autostart=false → démarré par startup.sh une fois la DB prête.
[program:laravel-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work --tries=3 --max-time=3600 --sleep=3
autostart=false
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
user=www-data
priority=100

# ─── Laravel Scheduler ────────────────────────────────────────────────────────
# autostart=false → démarré par startup.sh une fois la DB prête.
[program:laravel-scheduler]
command=/bin/sh -c "while true; do php /app/artisan schedule:run --no-interaction; sleep 60; done"
autostart=false
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
user=www-data
priority=100
